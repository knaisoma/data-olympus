name: Set image channel

# Re-points a moving channel at an existing digest without build or deployment.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "moving channel tag to move"
        required: false
        default: "stable"
        type: choice
        options:
          - rc
          - stable
          - latest
      source:
        description: "existing image tag to point the channel at (e.g. v0.5.0-rc.1, v0.5.0)"
        required: true
        type: string

concurrency:
  group: set-channel-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-point channel at source digest
        env:
          REPO: ghcr.io/knaisoma/data-olympus
          CHANNEL: ${{ inputs.channel }}
          SOURCE: ${{ inputs.source }}
        run: python3 scripts/workflow_validation.py set-channel
