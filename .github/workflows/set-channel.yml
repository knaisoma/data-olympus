name: Set image channel

# Re-points a moving channel at an existing digest without build or deployment.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "moving channel tag to move"
        required: false
        default: "stable"
        type: choice
        options:
          - rc
          - stable
          - latest
      source:
        description: "existing image tag to point the channel at (e.g. v0.5.0-rc.1, v0.5.0)"
        required: true
        type: string

# Shared product lock: this workflow moves a channel, so it must not run beside
# a promotion, an RC publication or a branch cut. Unconditional on purpose: it
# has no ref guard and acts (packages: write) from any ref, so every run must
# hold the lock.
concurrency:
  group: data-olympus-promotion
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-point channel at source digest
        env:
          REPO: ghcr.io/knaisoma/data-olympus
          CHANNEL: ${{ inputs.channel }}
          SOURCE: ${{ inputs.source }}
        run: python3 scripts/workflow_validation.py set-channel
