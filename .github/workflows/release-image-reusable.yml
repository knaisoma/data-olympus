# .github/workflows/release-image-reusable.yml
name: build-and-push-image
on:
  workflow_call:
    inputs:
      ref:
        description: "immutable git ref to build"
        required: true
        type: string
      tag:
        description: "image tag to publish, e.g. v0.1.0 or edge"
        required: true
        type: string
      move_latest:
        description: "also move the :latest channel"
        required: false
        default: false
        type: boolean
      channel:
        description: "also push this moving channel tag (e.g. rc, stable); empty = none"
        required: false
        default: ""
        type: string
    outputs:
      digest:
        description: "immutable digest of the published image"
        value: ${{ jobs.build-push.outputs.digest }}
      source_sha:
        description: "exact source commit embedded in the image"
        value: ${{ jobs.build-push.outputs.source_sha }}
jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout workflow validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Compute image tags
        id: image-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          MOVE_LATEST: ${{ inputs.move_latest }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/workflow_validation.py image-tags
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tag.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
