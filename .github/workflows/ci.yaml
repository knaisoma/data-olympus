name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The benchmark receipt binds artifacts to the execution commit,
          # which is intentionally the parent of the receipt commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.13
      - run: uv pip install -e '.[dev]'
      - name: Read pinned OKF revision
        id: okf-pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          pin = json.loads(Path("tests/okf/reference.json").read_text())
          print(f"sha={pin['commit']}")
          PY
      - name: Check out the exact official OKF revision
        uses: actions/checkout@v7
        with:
          repository: GoogleCloudPlatform/knowledge-catalog
          ref: ${{ steps.okf-pin.outputs.sha }}
          path: to-delete/okf-reference
          persist-credentials: false
      - name: Prove bidirectional OKF interoperability
        run: |
          uv run python scripts/okf_conformance.py verify-pin
          uv run python scripts/okf_conformance.py consume-data-olympus --upstream-root to-delete/okf-reference
          uv run python scripts/okf_conformance.py consume-upstream
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: Benchmark docs drift guard (docs match committed results)
        run: uv run python scripts/check_benchmark_docs.py
      - run: uv run pytest -v
      - name: Install bats + jq (CLI contract tests)
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: bin/kb CLI tests (bats)
        run: bats -r tests
      - name: Lint example bundle (dogfood conformance check)
        run: uv run data-olympus lint example-bundle
  # pyproject declares requires-python >=3.13, so 3.14 is already inside the
  # supported range and users can install there today. This job is what makes
  # that claim tested rather than merely declared.
  #
  # Deliberately a separate job rather than a matrix on `test`: a matrix would
  # rename the check to `test (3.13)` / `test (3.14)` and silently break the
  # branch ruleset that requires `test`. It also stays narrower than `test` on
  # purpose. The 3.13 job remains the authoritative gate and keeps the OKF
  # conformance, benchmark-docs, bats and bundle-lint steps; this one answers
  # one question: does the product work on the next interpreter.
  #
  # Scope boundary worth knowing: this is pytest and mypy on 3.14, NOT a full
  # parallel validation. scripts/smoke_installed_wheel.py hard-codes
  # `uv venv --python 3.13`, so installed-wheel and sdist smoke tests still
  # exercise 3.13 no matter which job invokes them. Parameterising that is the
  # follow-up needed before claiming 3.14 installation coverage.
  test-python-3-14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Receipt provenance tests read git history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.14
      - run: uv pip install -e '.[dev]'
      - run: uv run mypy src
      - run: uv run pytest -v
  changelog-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changelog updated for functional changes
        env:
          KB_NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '1' || '0' }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t changed < <(git diff --name-only "origin/$BASE_REF"...HEAD)
          python3 scripts/check_changelog.py "${changed[@]}"
  version-free-guard:
    # Catch a duplicate DECLARED version before merge: if the PR bumps
    # [project].version to something already published on PyPI, ghcr, or as a
    # GitHub release/tag, fail here rather than at tag-release time (where a
    # failed guard would still be after the merge). A registry outage fails
    # closed. KB_BYPASS_VERSION_CHECK=1 is for explicit operator diagnostics only;
    # release automation must never use it to bypass version clearance.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard against a duplicate declared version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Only enforce when THIS pr changes [project].version. The version is
          # bumped at release time, so on a normal PR the declared version still
          # equals the last released (published) one; checking it unconditionally
          # would fail every non-release PR. Compare against the base branch and
          # skip when unchanged.
          HEAD_VERSION="$(python3 scripts/should_tag.py --print-version)"
          BASE_VERSION="$(git show "origin/$BASE_REF:pyproject.toml" | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.buffer.read().decode())["project"]["version"])')"
          if [ "$HEAD_VERSION" = "$BASE_VERSION" ]; then
            echo "declared version unchanged ($HEAD_VERSION); nothing to guard"
            exit 0
          fi
          echo "declared version changed $BASE_VERSION -> $HEAD_VERSION; checking it is free"

          # A history reconciliation is safe when an existing immutable release
          # tag enters the pull request history for the first time. The tag must
          # be an ancestor of this head, must not already be an ancestor of the
          # base, and its own project version must match the declared version.
          # This does not publish or move the tag. Every other version change
          # continues through the fail closed registry guard below.
          TAG="v$HEAD_VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG" && \
             git merge-base --is-ancestor "$TAG" HEAD && \
             ! git merge-base --is-ancestor "$TAG" "origin/$BASE_REF"; then
            TAG_VERSION="$(git show "$TAG:pyproject.toml" | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.buffer.read().decode())["project"]["version"])')"
            if [ "$TAG_VERSION" != "$HEAD_VERSION" ]; then
              echo "tag $TAG declares $TAG_VERSION, expected $HEAD_VERSION" >&2
              exit 1
            fi
            echo "tag $TAG newly enters this branch history: reconciliation allowed"
            exit 0
          fi

          python3 scripts/check_version_free.py --version "$HEAD_VERSION"
  doc-consistency-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.13
      - run: uv pip install -e '.[dev]'
      - name: Check SPEC.md / docs/adoption.md enums match format/validate.py
        run: uv run python3 scripts/check_doc_consistency.py
