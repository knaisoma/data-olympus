# .github/workflows/tag-release.yml
name: Promote complete release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "highest complete candidate to promote, for example 0.6.0-rc.3"
        required: true
        type: string

# Shared product lock, replacing the former per-candidate group. Two different
# candidates now serialise, which is intended: both move stable and latest.
# Only a dispatch from main enters the lock, because the decide job refuses any
# other ref; a refused run gets a private group and cannot replace a pending
# promotion or publication. The candidate_tag format cannot be tested in a
# concurrency expression, so a main dispatch with a malformed tag still enters.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'data-olympus-promotion' || format('tag-release-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide stable release version
        id: decide
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          if ! test "$GITHUB_REF" = "refs/heads/main"; then
            echo "stable promotion must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_TAG" \
              | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$'; then
            echo "candidate_tag must be X.Y.Z-rc.N with a positive N" >&2
            exit 1
          fi
          VERSION="${CANDIDATE_TAG%%-rc.*}"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  resolve-rc:
    needs: decide
    if: needs.decide.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image_digest: ${{ steps.resolve.outputs.image_digest }}
      rc_tag: ${{ steps.resolve.outputs.rc_tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the highest complete prerelease
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RC: ${{ inputs.candidate_tag }}
          VERSION: ${{ needs.decide.outputs.version }}
          REPO: ghcr.io/knaisoma/data-olympus
        run: |
          mkdir -p candidate
          gh release list --limit 100 --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isPrerelease and (.isDraft | not)) | .tagName' \
            > /tmp/prereleases.txt
          : > /tmp/complete-rcs.txt
          while IFS= read -r candidate_tag; do
            case "$candidate_tag" in
              "$VERSION"-rc.[0-9]*) ;;
              *) continue ;;
            esac
            assets="$(gh release view "$candidate_tag" --json assets --jq '.assets[].name')"
            if grep -qx 'release-provenance.json' <<<"$assets" && \
               grep -Eq '^data_olympus-.*\.whl$' <<<"$assets" && \
               grep -Eq '^data_olympus-.*\.tar\.gz$' <<<"$assets"; then
              echo "$candidate_tag" >> /tmp/complete-rcs.txt
            fi
          done < /tmp/prereleases.txt
          RC_TAG="$(python3 scripts/rc_tag.py --base "$VERSION" --current < /tmp/complete-rcs.txt)"
          test -n "$RC_TAG"
          test "$RC_TAG" = "$REQUESTED_RC"
          gh release download "$RC_TAG" --pattern release-provenance.json --dir candidate
          SOURCE_SHA="$(jq -r .source_sha candidate/release-provenance.json)"
          IMAGE_DIGEST="$(jq -r .image_digest candidate/release-provenance.json)"
          test "$(jq -r .candidate_tag candidate/release-provenance.json)" = "$RC_TAG"
          test "$(jq -r .candidate.version candidate/release-provenance.json)" \
            = "${VERSION}rc${RC_TAG##*.}"
          test -n "$SOURCE_SHA"
          test -n "$IMAGE_DIGEST"
          git fetch origin "refs/tags/$RC_TAG:refs/tags/$RC_TAG"
          test "$(git rev-list -n 1 "$RC_TAG")" = "$SOURCE_SHA"
          SOURCE_VERSION="$(git show "$SOURCE_SHA:pyproject.toml" \
            | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          test "$SOURCE_VERSION" = "$VERSION"
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          with open("candidate/release-provenance.json", encoding="utf-8") as stream:
              provenance = json.load(stream)
          candidate = provenance["candidate"]
          url = f"https://pypi.org/pypi/data-olympus/{candidate['version']}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      pypi = json.load(response)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          remote = {item["filename"]: item["digests"]["sha256"] for item in pypi["urls"]}
          expected = {
              candidate["wheel"]: candidate["wheel_sha256"],
              candidate["sdist"]: candidate["sdist_sha256"],
          }
          if any(remote.get(name) != sha256 for name, sha256 in expected.items()):
              raise SystemExit("candidate PyPI sha256 does not match provenance")
          PY
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          docker buildx imagetools inspect "$REPO@$IMAGE_DIGEST" >/dev/null
          {
            echo "rc_tag=$RC_TAG"
            echo "source_sha=$SOURCE_SHA"
            echo "image_digest=$IMAGE_DIGEST"
          } | tee -a "$GITHUB_OUTPUT"

  create-tag:
    needs: [decide, resolve-rc, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-rc.outputs.source_sha }}
          fetch-depth: 0
      - name: Create and push annotated tag
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-rc.outputs.source_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          else
            git tag -a "$TAG" "$SOURCE_SHA" -m "Release ${TAG#v}"
            git push origin "$TAG"
          fi

  publish-pypi:
    needs: [decide, resolve-rc]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/data-olympus
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-rc.outputs.source_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Download candidate comparison inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ needs.resolve-rc.outputs.rc_tag }}
        run: |
          mkdir -p candidate
          gh release download "$RC_TAG" \
            --pattern '*.whl' --pattern release-provenance.json --dir candidate
      - name: Build and compare stable Python artifacts
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          CANDIDATE_WHEEL="$(find candidate -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$CANDIDATE_WHEEL"
          uv run python scripts/release_artifacts.py stable \
            --base "$VERSION" --source . --output dist \
            --candidate-provenance candidate/release-provenance.json \
            --candidate-wheel "$CANDIDATE_WHEEL" \
            --provenance release-provenance.json
          uvx twine check --strict dist/*
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run python scripts/smoke_installed_wheel.py \
              --artifact "$artifact" --expected-version "$VERSION"
          done
      - name: Publish stable package using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
      - name: Verify stable PyPI files by SHA256
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.request

          url = f"https://pypi.org/pypi/data-olympus/{os.environ['VERSION']}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          remote = {item["filename"]: item["digests"]["sha256"] for item in payload["urls"]}
          dist = pathlib.Path("dist")
          artifacts = sorted([*dist.glob("*.whl"), *dist.glob("*.tar.gz")])
          if not artifacts:
              raise SystemExit("No publishable Python artifacts found")
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in artifacts
          }
          if remote != local:
              raise SystemExit(f"PyPI SHA256 mismatch: local={local}, remote={remote}")
          PY
      - name: Upload stable release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stable-${{ needs.decide.outputs.tag }}
          path: |
            dist/
            release-provenance.json
          if-no-files-found: error

  promote-image:
    needs: [decide, resolve-rc, create-tag, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the verified candidate digest
        env:
          IMAGE_DIGEST: ${{ needs.resolve-rc.outputs.image_digest }}
          REPO: ghcr.io/knaisoma/data-olympus
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if docker buildx imagetools inspect \
              "$REPO:$TAG" > /tmp/version-image.txt 2> /tmp/version-error.txt; then
            VERSION_DIGEST="$(awk '/^Digest:/ {print $2; exit}' /tmp/version-image.txt)"
            test "$VERSION_DIGEST" = "$IMAGE_DIGEST"
          elif grep -qiE 'manifest unknown|not found|no such manifest' \
              /tmp/version-error.txt; then
            docker buildx imagetools create --tag "$REPO:$TAG" "$REPO@$IMAGE_DIGEST"
          else
            cat /tmp/version-error.txt >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$REPO:stable" --tag "$REPO:latest" \
            "$REPO@$IMAGE_DIGEST"
          for channel in "$TAG" stable latest; do
            docker buildx imagetools inspect "$REPO:$channel" \
              | grep -E "Digest:[[:space:]]*$IMAGE_DIGEST"
          done

  release:
    needs: [decide, resolve-rc, create-tag, publish-pypi, promote-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-rc.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stable-${{ needs.decide.outputs.tag }}
      - name: Create GitHub release after Python and OCI publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.resolve-rc.outputs.source_sha }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
            python3 scripts/release_upload.py "$TAG" dist/* release-provenance.json
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" --target "$SOURCE_SHA" --title "$TAG" \
              --notes-file "$NOTES" dist/* release-provenance.json
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --title "$TAG" \
              --generate-notes dist/* release-provenance.json
          fi

  publish-mcp-registry:
    # Last on purpose: a registry outage must not hold back PyPI, the image or
    # the GitHub release. A failure here is visible and the job can be re-run.
    needs: [decide, resolve-rc, publish-pypi, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      REGISTRY: https://registry.modelcontextprotocol.io
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-rc.outputs.source_sha }}
      - name: Check server.json and the PyPI ownership marker
        run: |
          test "$(jq -er '.version' server.json)" = "$VERSION"
          test "$(jq -er '.packages[0].version' server.json)" = "$VERSION"
          SERVER_NAME="$(jq -er '.name' server.json)"
          for attempt in $(seq 1 12); do
            if curl -fsS "https://pypi.org/pypi/data-olympus/${VERSION}/json" \
                -o /tmp/pypi.json; then
              break
            fi
            test "$attempt" -lt 12
            sleep 5
          done
          jq -e --arg marker "<!-- mcp-name: ${SERVER_NAME} -->" \
            '(.info.description // "") | contains($marker)' /tmp/pypi.json
          echo "SERVER_NAME=$SERVER_NAME" >> "$GITHUB_ENV"
      - name: Install the pinned mcp-publisher
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher --help >/dev/null
      - name: Publish the registry entry with GitHub OIDC
        run: |
          # A failed read must never look like "not listed": retry it, then
          # stop rather than publish blind. The version filter keeps a long
          # history from paging the release out; the unfiltered search is a
          # second opinion in case the filter's semantics change.
          registry_query() {
            for _ in $(seq 1 6); do
              # A 200 whose body is not the expected shape is a failed read too.
              if curl -fsS --get "$REGISTRY/v0/servers" "$@" -o /tmp/registry.json \
                  && jq -r --arg name "$SERVER_NAME" \
                    '.servers[] | (.server // .) | select(.name == $name) | .version' \
                    /tmp/registry.json > /tmp/registry-versions.txt; then
                cat /tmp/registry-versions.txt
                return 0
              fi
              sleep 5
            done
            echo "cannot read the registry API at $REGISTRY" >&2
            return 1
          }
          is_listed() {
            local filtered unfiltered
            filtered="$(registry_query --data-urlencode "search=$SERVER_NAME" \
              --data-urlencode "version=$VERSION")" || exit 1
            grep -qx "$VERSION" <<<"$filtered" && return 0
            unfiltered="$(registry_query --data-urlencode "search=$SERVER_NAME")" || exit 1
            grep -qx "$VERSION" <<<"$unfiltered"
          }
          if is_listed; then
            echo "$SERVER_NAME $VERSION is already in the registry; not publishing again"
          else
            /tmp/mcp-publisher login github-oidc
            /tmp/mcp-publisher publish
          fi
          for _ in $(seq 1 12); do
            if is_listed; then
              echo "registry lists $SERVER_NAME $VERSION"
              exit 0
            fi
            sleep 5
          done
          echo "registry does not list $SERVER_NAME $VERSION after publishing" >&2
          exit 1
