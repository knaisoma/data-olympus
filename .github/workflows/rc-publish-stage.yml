name: rc-publish-stage

# Stage 2 of the two-stage RC pipeline (W6 R8). workflow_run always uses the
# definition on main, and every job that runs scripts checks out that same
# main commit (github.sha). The candidate H is fetched as Git data only;
# no code from H runs here. Disabled unless vars.SDLC_PIPELINE is exactly
# 'enabled' (R6). Only GITHUB_TOKEN and OIDC are used, never a personal
# token; stage 2 needs no GitHub App token. If a job ever needs one, it uses
# the `sdlc-bot` environment (main-only), App id `vars.SDLC_APP_ID` and the
# environment secret `SDLC_APP_PRIVATE_KEY`, never a repository-wide secret.
# Every job that runs repository code repeats the full verification under the
# shared lock. `attest` runs none and only re-checks hashes; it must never get
# a checkout or the script, because it holds the signing identity.
#
# Action pins: checkout, setup-uv, attest-build-provenance and
# gh-action-pypi-publish use full commit SHAs with the tag in a trailing
# comment (enforced by tests/test_rc_verify_and_publish.py). The artifact
# actions keep tag pins.

on:
  workflow_run:
    workflows: [rc-build]
    types: [completed]

permissions: {}

# Only an admitted run (the same conditions as the reserve job gate) takes the
# shared promotion lock. Failed builds, dry runs, other branches and every run
# while SDLC_PIPELINE is disabled get a private per-run group, so they can
# never cancel a pending publication, promotion or recut.
concurrency:
  group: >-
    ${{ (
      vars.SDLC_PIPELINE == 'enabled' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'release/new' ||
       github.event.workflow_run.head_branch == 'hotfix/new') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    ) && 'data-olympus-promotion' || format('rc-publish-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  reserve:
    if: >-
      vars.SDLC_PIPELINE == 'enabled' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'release/new' ||
       github.event.workflow_run.head_branch == 'hotfix/new') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: read
    outputs:
      upload: ${{ steps.reserve.outputs.upload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: '3.13'
      - name: Require Skopeo
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install --yes skopeo; }
          skopeo --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rc-build-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: to-delete/rc-input
      - name: Verify artifacts and reserve the candidate identity
        id: reserve
        env:
          SDLC_PIPELINE: ${{ vars.SDLC_PIPELINE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --no-project python scripts/rc_verify_and_publish.py reserve \
            --artifacts to-delete/rc-input --history to-delete/rc-history.git

  pypi:
    needs: reserve
    if: needs.reserve.outputs.upload == 'true'
    runs-on: ubuntu-latest
    environment: pypi-rc
    permissions:
      actions: read
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: '3.13'
      - name: Require Skopeo
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install --yes skopeo; }
          skopeo --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rc-build-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: to-delete/rc-input
      - name: Re-verify and stage only the files PyPI lacks
        id: stage
        env:
          SDLC_PIPELINE: ${{ vars.SDLC_PIPELINE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --no-project python scripts/rc_verify_and_publish.py stage-upload \
            --artifacts to-delete/rc-input --history to-delete/rc-history.git \
            --upload to-delete/rc-upload
      - name: Publish with PyPI Trusted Publishing
        if: steps.stage.outputs.upload == 'true'
        # No password or token: OIDC only. No skip-existing: a file that already
        # exists was excluded by the verifier, so any conflict must fail.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: to-delete/rc-upload/

  publish:
    needs: [reserve, pypi]
    if: >-
      !cancelled() &&
      needs.reserve.result == 'success' &&
      (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    # No id-token and no attestations here: this job parses the untrusted
    # archives, so it never holds the signing identity (attest job below).
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
      wheel: ${{ steps.publish.outputs.wheel }}
      wheel_sha256: ${{ steps.publish.outputs.wheel_sha256 }}
      sdist: ${{ steps.publish.outputs.sdist }}
      sdist_sha256: ${{ steps.publish.outputs.sdist_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: '3.13'
      - name: Require Skopeo
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install --yes skopeo; }
          skopeo --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rc-build-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: to-delete/rc-input
      - name: Verify PyPI, publish the OCI digest and record staging selection
        id: publish
        env:
          SDLC_PIPELINE: ${{ vars.SDLC_PIPELINE }}
          # rc stays with set-channel.yml until the first new-model release
          # (W6 invariant); Task 9 sets SDLC_RC_CHANNEL=enabled after it.
          SDLC_RC_CHANNEL: ${{ vars.SDLC_RC_CHANNEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --no-project python scripts/rc_verify_and_publish.py publish \
            --artifacts to-delete/rc-input --history to-delete/rc-history.git \
            --selection to-delete/rc-selection/staging-selection.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staging-selection-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          path: to-delete/rc-selection/staging-selection.json
          if-no-files-found: error

  attest:
    needs: publish
    runs-on: ubuntu-latest
    # The signing identity lives only here. This job runs no repository code
    # and parses no archive: it re-checks the downloaded files against the
    # hashes the publish job verified, then signs exactly those subjects.
    permissions:
      actions: read
      attestations: write
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rc-build-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: to-delete/rc-input
      - name: Check the files against the verified hashes
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          WHEEL: ${{ needs.publish.outputs.wheel }}
          WHEEL_SHA256: ${{ needs.publish.outputs.wheel_sha256 }}
          SDIST: ${{ needs.publish.outputs.sdist }}
          SDIST_SHA256: ${{ needs.publish.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          fail() { echo "attestation input refused: $1" >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "image digest"
          [[ "$WHEEL" =~ ^data_olympus-[A-Za-z0-9_.-]+\.whl$ ]] || fail "wheel name"
          [[ "$SDIST" =~ ^data_olympus-[A-Za-z0-9_.-]+\.tar\.gz$ ]] || fail "sdist name"
          [[ "$WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "wheel hash"
          [[ "$SDIST_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "sdist hash"
          mkdir to-delete/rc-attest
          for name in "$WHEEL" "$SDIST"; do
            source="to-delete/rc-input/dist/$name"
            [[ -f "$source" && ! -L "$source" ]] || fail "not a regular file"
            cp -- "$source" "to-delete/rc-attest/$name"
          done
          cd to-delete/rc-attest
          printf '%s  %s\n' "$WHEEL_SHA256" "$WHEEL" "$SDIST_SHA256" "$SDIST" \
            | sha256sum --check --strict - || fail "hash mismatch"
      - name: Log in to GHCR for the registry attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Contract for promote-release: gh attestation verify --signer-workflow
      # knaisoma/data-olympus/.github/workflows/rc-publish-stage.yml. Subjects
      # are only the objects verified and published by the publish job.
      - name: Attest the published image digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          subject-name: ghcr.io/knaisoma/data-olympus
          subject-digest: ${{ needs.publish.outputs.image_digest }}
          push-to-registry: true
      - name: Attest the verified wheel and sdist
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          subject-path: |
            to-delete/rc-attest/*.whl
            to-delete/rc-attest/*.tar.gz
