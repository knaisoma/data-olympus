# .github/workflows/publish-pypi-reusable.yml
#
# This workflow uploads to PyPI via Trusted Publishing (OIDC, no API token).
# PyPI binds the publisher to the TOP-LEVEL
# workflow that starts the run. This reusable workflow is now called only from
# publish-pypi.yml, the manual fallback. The primary
# rc-publish.yml and tag-release.yml paths publish inline and have their own
# publisher identities.
# See docs/releases/pypi-trusted-publishing.md for the exact setup path. A
# missing publisher or a registry mismatch fails the caller closed.
name: publish-pypi-reusable

on:
  workflow_call:
    inputs:
      ref:
        description: "git ref to build from (tag or sha)"
        required: true
        type: string
      upload:
        description: "upload to PyPI (false = build + twine check only)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    uses: ./.github/workflows/publish-python-build.yml
    with:
      ref: ${{ inputs.ref }}
    permissions:
      contents: read

  validate:
    needs: build
    if: inputs.upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Check existing PyPI file hashes before upload
        id: check
        env:
          PYPI_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/workflow_validation.py python-hashes
          echo "passed=true" >> "$GITHUB_OUTPUT"

  upload:
    # Only validated release artifacts enter the credential-bearing job.
    needs: validate
    if: inputs.upload && needs.validate.outputs.passed == 'true'
    runs-on: ubuntu-latest
    # Trusted Publishing requires the `pypi` environment name to match the
    # pending-publisher config on pypi.org.
    environment:
      name: pypi
      url: https://pypi.org/p/data-olympus
    permissions:
      # id-token: write is what mints the OIDC token gh-action-pypi-publish
      # exchanges for a short-lived upload credential. No secret token exists.
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # No `password:` or token: OIDC Trusted Publishing only. skip-existing so a
        # partial-failure rerun of an already-uploaded version is a no-op, not an
        # error (mirrors the idempotent tag/image/release jobs).
        with:
          skip-existing: true

  verify:
    needs: [build, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Verify PyPI files by SHA256
        env:
          PYPI_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.request

          url = f"https://pypi.org/pypi/data-olympus/{os.environ['PYPI_VERSION']}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          remote = {item["filename"]: item["digests"]["sha256"] for item in payload["urls"]}
          dist = pathlib.Path("dist")
          artifacts = sorted([*dist.glob("*.whl"), *dist.glob("*.tar.gz")])
          if not artifacts:
              raise SystemExit("No publishable Python artifacts found")
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in artifacts
          }
          if remote != local:
              raise SystemExit(f"PyPI SHA256 mismatch: local={local}, remote={remote}")
          PY
