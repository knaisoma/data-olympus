name: rc-build

on:
  push:
    branches: [release/new, hotfix/new]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify artifacts without allowing promotion
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Stage 1 is unprivileged; newer heads can cancel obsolete builds.
  group: rc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.13'
      - name: Fetch current heads and require exact source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = branch
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/build-head"
          mkdir -p to-delete/rc-build
          # For an adoption cut, preflight reads both pinned ratifications and
          # vendored standards from origin/main's blobs (never from this H
          # checkout) into to-delete/rc-trusted, outside the uploaded artifact,
          # and runs the engine once with them. Stage 2 recomputes with main's
          # own checkout, so this stage is not trusted for the result.
          uv run python scripts/rc_decide.py preflight \
            --head "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" \
            --branch-ref refs/remotes/origin/build-head \
            --event "$GITHUB_EVENT_NAME" --dry-run "$DRY_RUN" \
            --trusted-dir to-delete/rc-trusted >> "$GITHUB_ENV"
      - name: Compute content-derived identity and build decision
        run: |
          set -euo pipefail
          # Adoption dry run exists only for a dispatched dry run (preflight).
          adoption=()
          case "$ADOPTION_MODE" in
            none) ;;
            ratified) adoption=(--adoption-ratified "$ADOPTION_RATIFIED" --standard-file "$ADOPTION_STANDARD_FILE"
                                --extension-ratified "$ADOPTION_EXTENSION_RATIFIED"
                                --extension-standard-file "$ADOPTION_EXTENSION_STANDARD_FILE") ;;
            dry-run) adoption=(--adoption-dry-run) ;;
            *) echo "unknown adoption mode" >&2; exit 1 ;;
          esac
          uv run python scripts/sdlc_version.py \
            --head "$GITHUB_SHA" --main refs/remotes/origin/main \
            --branch "$ENGINE_BRANCH" "${adoption[@]}" \
            --json-output to-delete/rc-build/version.json \
            --env-output to-delete/rc-build/version.env
          cat to-delete/rc-build/version.env >> "$GITHUB_ENV"
          uv run python scripts/rc_decide.py decide \
            --version-file to-delete/rc-build/version.json \
            --output to-delete/rc-build/decision.json --dry-run "$DRY_RUN" >> "$GITHUB_ENV"
      - name: Build and verify Python distributions
        run: |
          set -euo pipefail
          uv run python scripts/release_artifacts.py candidate \
            --candidate-tag "$RC_VERSION" --source . \
            --output to-delete/rc-build/dist \
            --provenance to-delete/rc-build/python-provenance.json
          uvx twine check --strict to-delete/rc-build/dist/*
          for artifact in to-delete/rc-build/dist/*.whl to-delete/rc-build/dist/*.tar.gz; do
            uv run python scripts/smoke_installed_wheel.py \
              --artifact "$artifact" --expected-version "$PYPI_VERSION"
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build OCI archive with injected package version
        run: |
          set -euo pipefail
          uv run python scripts/release_artifacts.py prepare-context \
            --source . --output to-delete/rc-context --version "$PYPI_VERSION"
          docker buildx build to-delete/rc-context \
            --file to-delete/rc-context/deploy/docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.version=$RC_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "ghcr.io/knaisoma/data-olympus:$RC_VERSION" \
            --output type=oci,dest=to-delete/rc-build/image.oci.tar \
            --metadata-file to-delete/rc-build/image-metadata.json
      # Per-artifact SBOMs (docs/releases/rc-build.md). The pinned release
      # archive is checked against its published SHA-256 before it runs.
      - name: Install the pinned syft
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          set -euo pipefail
          mkdir -p to-delete/tools
          curl -fsSL -o to-delete/tools/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  to-delete/tools/syft.tar.gz" | sha256sum --check --strict -
          tar -xzf to-delete/tools/syft.tar.gz -C to-delete/tools syft
          test "$(to-delete/tools/syft version -o json | jq -er .version)" = "$SYFT_VERSION"
      - name: Generate per-artifact SBOMs
        env:
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          set -euo pipefail
          SYFT=to-delete/tools/syft
          OUT=to-delete/rc-build/sbom
          mkdir -p "$OUT" to-delete/sbom-src
          # The runtime closure the candidate was validated with: uv.lock
          # without the dev group. Each package SBOM lists it with the package.
          uv export --frozen --no-dev --no-emit-project --no-header \
            --format requirements-txt -o to-delete/sbom-src/requirements.txt
          for artifact in to-delete/rc-build/dist/*.whl to-delete/rc-build/dist/*.tar.gz; do
            name="$(basename "$artifact")"
            tree="to-delete/sbom-src/$name"
            mkdir -p "$tree/.sbom-lock"
            case "$name" in
              *.whl) python3 -m zipfile -e "$artifact" "$tree" ;;
              *.tar.gz) tar -xzf "$artifact" -C "$tree" ;;
            esac
            cp to-delete/sbom-src/requirements.txt "$tree/.sbom-lock/requirements.txt"
            "$SYFT" scan "dir:$tree" --source-name data-olympus --source-version "$PYPI_VERSION" \
              -q -o "spdx-json=$OUT/$name.spdx.json"
          done
          # One document per platform manifest; its root checksum is that digest.
          for platform in linux/amd64 linux/arm64; do
            "$SYFT" scan oci-archive:to-delete/rc-build/image.oci.tar --platform "$platform" \
              --source-name ghcr.io/knaisoma/data-olympus --source-version "$RC_VERSION" \
              -q -o "spdx-json=$OUT/image-${platform//\//-}.spdx.json"
          done
      - name: Record archive provenance
        run: |
          set -euo pipefail
          IMAGE_DIGEST="$(jq -er '."containerimage.digest"' to-delete/rc-build/image-metadata.json)"
          MAIN_SHA="$(jq -er '.M' to-delete/rc-build/version.json)"
          uv run python scripts/release_artifacts.py finalize-archive \
            --provenance to-delete/rc-build/python-provenance.json \
            --output to-delete/rc-build/release-provenance.json \
            --candidate-tag "$RC_VERSION" --source-sha "$GITHUB_SHA" \
            --base-sha "$CUT_SHA" --main-sha "$MAIN_SHA" --number "$N" \
            --image-digest "$IMAGE_DIGEST" --oci-archive to-delete/rc-build/image.oci.tar \
            --promotable "$PROMOTABLE" --dry-run "$DRY_RUN"
          # Per-artifact SBOM receipt ("sboms"), checked against this provenance.
          uv run python scripts/sbom_evidence.py embed \
            --provenance to-delete/rc-build/release-provenance.json \
            --sbom-dir to-delete/rc-build/sbom --oci-archive to-delete/rc-build/image.oci.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rc-build-${{ github.sha }}-${{ github.run_attempt }}
          path: to-delete/rc-build/
          if-no-files-found: error
