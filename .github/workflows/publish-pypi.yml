# Trusted Publisher setup: docs/releases/pypi-trusted-publishing.md.
name: Publish to PyPI

on:
  # DRY RUN on PRs that touch packaging. Build + twine check only, never upload.
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "bin/**"
      - "scripts/smoke_installed_wheel.py"
      - "tests/test_installed_wheel_smoke.py"
      - ".github/workflows/publish-pypi*.yml"
      - ".github/workflows/publish-python-build.yml"
  # Branches, full SHAs and nonrelease local refs build only; release tags upload.
  workflow_dispatch:
    inputs:
      ref:
        description: "release tag to publish (must be v*); any other ref is dry-run only"
        required: true

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/publish-python-build.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  # Validate the manual input BEFORE any upload: upload is enabled only when the
  # ref is an exact release tag that resolves to a commit. Other valid refs
  # retain build-only behavior; malformed or absent release tags fail closed.
  validate-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upload: ${{ steps.check.outputs.upload }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether this ref may upload
        id: check
        env:
          REF: ${{ inputs.ref }}
        run: python3 scripts/workflow_validation.py manual-python

  manual:
    needs: validate-manual
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/publish-pypi-reusable.yml
    with:
      ref: ${{ needs.validate-manual.outputs.sha }}
      upload: ${{ needs.validate-manual.outputs.upload == 'true' }}
    permissions:
      contents: read
      id-token: write
