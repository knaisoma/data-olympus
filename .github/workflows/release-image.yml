# .github/workflows/release-image.yml
name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "preview image tag to publish, e.g. edge"
        required: false
        default: "edge"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Validate manual publication tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: python3 scripts/workflow_validation.py manual-image
  prerelease:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-image-reusable.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ inputs.tag }}
      move_latest: false
    permissions:
      contents: read
      packages: write
