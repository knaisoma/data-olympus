# .github/workflows/release-image.yml
name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "preview image tag to publish, e.g. edge"
        required: false
        default: "edge"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Validate manual publication tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: python3 scripts/workflow_validation.py manual-image
  prerelease:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-image-reusable.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ inputs.tag }}
      move_latest: false
    permissions:
      contents: read
      packages: write
